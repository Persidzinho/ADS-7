var off = [4,14,28,46,68,94,124,158,196,238,284,334,388,446,508,574,644,718,796,878,964,1054,1148,1246,1348,1454,1564,1678,1796,1918,2044,2174,2308,2446,2588,2734,2884,3038,3196,3358,3524,3694,3868,4046,4228,4414,4604,4798,4996,5198,5404,5614,5828,6046,6268,6494,6724,6958,7196,7438,7684,7934,8188,8446,8708,8974,9244,9518,9796,10078,10364,10654,10948,11246,11548,11854,12164,12478,12796,13118,13444,13774,14108,14446,14788,15134,15484,15838,16196,16558,16924,17294,17668,18046,18428,18814,19204,19598,19996,20398];
var on = [6,22,46,78,118,166,222,286,358,438,526,622,726,838,958,1086,1222,1366,1518,1678,1846,2022,2206,2398,2598,2806,3022,3246,3478,3718,3966,4222,4486,4758,5038,5326,5622,5926,6238,6558,6886,7222,7566,7918,8278,8646,9022,9406,9798,10198,10606,11022,11446,11878,12318,12766,13222,13686,14158,14638,15126,15622,16126,16638,17158,17686,18222,18766,19318,19878,20446,21022,21606,22198,22798,23406,24022,24646,25278,25918,26566,27222,27886,28558,29238,29926,30622,31326,32038,32758,33486,34222,34966,35718,36478,37246,38022,38806,39598,40398];

var canvas = document.getElementById("plot");
var ctx = canvas.getContext("2d");
var w = canvas.width, h = canvas.height;
var pad = 60;
var xmax = Math.max.apply(null, n);
var ymax = Math.max.apply(null, on);
function sx(x) { return pad + x / xmax * (w - 2*pad); }
function sy(y) { return h - pad - y / ymax * (h - 2*pad); }
function drawLine(data, color, label) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (var i = 0; i < n.length; i++) {
    var x = sx(n[i]), y = sy(data[i]);
    if (i == 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = "12px sans-serif";
  ctx.fillText(label, sx(100), sy(data[50])-10);
}
drawLine(off, "blue", "all off");
drawLine(on, "red", "all on");
drawLine(rand, "green", "random");
ctx.strokeStyle = "#000";
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.lineTo(w-pad, h-pad);
ctx.stroke();
ctx.font = "12px sans-serif";
ctx.fillStyle = "#000";
ctx.fillText("0", pad-20, h-pad+15);
ctx.fillText("n", w-pad+5, h-pad+15);
ctx.fillText("Train length n", w/2, h-10);
ctx.save();
ctx.translate(15, h/2);
ctx.rotate(-Math.PI/2);
ctx.fillText("Operations count", 0, 0);
ctx.restore();
